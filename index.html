<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Grundlagen</title>

    <link rel="stylesheet" href="style.css">

    <script src="./basics.js"></script> <!-- defer sagt, dass das Script parallel zum Body gelesen wird-->
    <script src="./strings_numbergs.js"></script>
    <script src="./conditional_code.js"></script>
    <script src="./functions.js"></script>
    <script src="./objects.js"></script>

    <style>
        .green_bg {
            width: 50px;
            height: 50px;
            background-color: green;
        }
    </style>

</head>

<!-- mit onload kann direkt beim Laden was ausgeführt werden -->

<body onload="console.log(12)">

    <h1 id="website_title">
        Der Titel der Website
    </h1>

    <div id="test_div"></div>

    <!-- bei onkeydown und bei onkeyup wird bei jedem Tastendruck getriggert, je nachdem ob up or down -->
    <input id="test_input" type="number" value="5" onkeydown="console.log('onkeydown')">

    <!-- wenn ich nur in das Feld rein gehe (ihm den Fokus gebe) wird es augeführt bei onfocus -->
    <input type="text" onfocus="console.log(34588)">

    <!-- bei onchange wird bei einer Änderung und heraus gehen der Inhaltes ausgeführt -->
    <input type="checkbox" onchange="console.log('true')">

    <p id="test_ptag">Ich bin das p tag</p>

    <!-- Mit onclick kann wie hier auch eine Funktion aus JS (dom_manupulation.js) ausgeführt werden -->
    <button onclick="dispNone('test_ptag')">bitte ausführen</button>

</body>

<script src="./dom_manupulation.js"></script>

</html>
